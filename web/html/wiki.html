<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<!-- Always force latest IE rendering engine (even in intranet) & Chrome Frame
		Remove this if you use the .htaccess -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

		<title>trailer.wiki</title>
		<meta name="description" content="">
		<meta name="author" content="kraft-p">

		<meta name="viewport" content="width=device-width; initial-scale=1.0">
		<link href="/html/trailer.css" rel="stylesheet" type="text/css"/>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<script src="/libs/jquery.min.js" type="text/javascript"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
		<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
		<script>
			function makebreadcrumbs() {
				// Creates the breadcrumb navigation from the current url
			    var path='';
				var href = window.location.pathname;
				var s = href.split("/");
				for (var i=0;i<(s.length-1);i++) {
					path+='<a href="'+href.substring(0,href.indexOf('/'+s[i])+s[i].length+1)+'/">' +
							s[i]+'</a> / ';
				}
				i=s.length-1;
				path += '<a href="'+href.substring(0,href.indexOf(s[i])+s[i].length)+'">'+s[i]+'</a>';
				return path;
			}
			function edit_toggle() {
				$('#editdiv').slideToggle();
				$('#edit').toggleClass('active');
			}
			function err_or_redirect(resp) {
				if (resp.startsWith('/')) {
					window.location.href = resp;
				} else {
					$('#error').html(resp);
				}
			}
			function add(name) {
			    if (name) {
					$.post('/wiki/new/',
						{href:location.pathname, name:name},
						err_or_redirect
					);

				}
			}
			function save() {
				var posttext = $('#source').val();
				$.post('/wiki/save',
					{href:window.location.pathname, text:posttext},
					function(resp) {
						edit_toggle();
						$('#wiki').html(resp);
						$('#is_saved').fadeOut();
						$('#editdiv').removeClass('warning');
				});
			}
			$(function() {
				var simplemde = new SimpleMDE();
				$('body').keydown(function(e){
					if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)){
						e.preventDefault();
						save();
					}
				});
			    $('#breadcrumbs').html(makebreadcrumbs());
			    $('#newname').val(window.location.pathname);
			    $('#edit').click(edit_toggle);
				$('#new').click(function() {
				    $('#newdiv').slideToggle();
                });

			    $('#preview').click(function(){
			        var posttext = $('#source').val();
			        $.post('/wiki/preview',
						{href:window.location.pathname, text:posttext},
						function(resp) {
			            	$('#wiki').html(resp);
			        });
				});
			    $('#newfile').click(function() {
			        var name = prompt('New file in ' + location.pathname);
					if (name)
			        	add(name + '.wiki');
				});

			    $('#newfolder').click(function(){
			        var name = prompt('New folder in ' + location.pathname);
			        if (name)
			            add(name + '/');
				});

			    $('#save').click(save);

			    $('#delete').click(function() {
			        if (confirm('Do you really want to delete this page:\n' +
								window.location.pathname)) {
						$.post('/wiki/delete',
							{href:window.location.pathname},
							err_or_redirect
							);
					}

				});

			    $('#source').bind('input propertychange', function() {
			        $('#is_saved').fadeIn();
			        $('#editdiv').addClass('warning');
				});
			});
		</script>
		<style>
			textarea {
				width: 100%;
				font-family: "Lucida Console", Monaco, monospace
			}
			.title {
				width: 100%;
			}
		</style>

	</head>
	<body>
		<div class="fright big">
			<a class="button" title="reload" onclick="window.location.reload();">&#x21bb;</a>
			<a href="/loggerplot" class="button" title="plot logger">&#x2600;</a>
			<a href="/map" class="button" title="map">&#x2316;</a>
			<a href="/wiki" class="button" title="show wiki">?</a>
			<a class="button" href="/" title="home">&#x2302;</a>
		</div>

		<div class="title normal big" id="menu">
			<a class="button" href="/" title="home">&#x2302;</a>
			<span id="breadcrumbs"></span>
			<a class="button" id="edit" title="open editor">&#x25BC;</a>
			<div class="error" id="error"></div>
			<div class="normal hidden" id="editdiv">
				<div>
					<textarea id="source" rows="15"><!--SOURCE--></textarea>
				</div>
				<div>
					<a class="button" id="preview">preview...</a>
					<a class="button" id="save">save...</a>
					<a class="button" id="delete" title="delete current page">delete...</a>
					<span id="is_saved" class="hidden">* not saved</span>
				</div>

			</div>
		</div>
		<div class="normal" id="wiki">
			<!--WIKI-->
		</div>
	</body>
</html>
