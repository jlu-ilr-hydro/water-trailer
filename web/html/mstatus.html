<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<!-- Always force latest IE rendering engine (even in intranet) & Chrome Frame
		Remove this if you use the .htaccess -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="mobile-web-app-capable" content="yes">
		<title>trailer.status</title>
		<meta name="description" content="">
		<meta name="author" content="kraft-p">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

		<meta name="viewport" content="width=device-width; initial-scale=1.0">

		<link href="/libs/jquery-ui/dist/themes/ui-lightness/jquery-ui.min.css" rel="stylesheet" type="text/css"/>
		<link href="/libs/jquery-mobile/css/jquery.mobile.css" rel="stylesheet" type="text/css"/>

		<link href="/html/trailer.css" rel="stylesheet" type="text/css"/>

		<script src="/libs/jquery/dist/jquery.js"></script>
		<script src="/libs/jquery-ui/dist/jquery-ui.min.js" type="text/javascript"></script>
		<script src="/libs/moment/moment.js" type="text/javascript"></script>
		<script src="/libs/jquery-mobile/js/jquery.mobile.js"></script>
		<script src="/libs/flot/dist/es5/jquery.flot.js" type="text/javascript" ></script>
		<script src="/libs/flot/source/jquery.flot.time.js" type="text/javascript" ></script>		

		<script src="/html/status.js" type="text/javascript"></script>
		<style>
			select {
				width: 1em;
			}
			.progress {
				position: relative;
				/*border: 1px solid black;*/
			}
			.progress .progress-label {
				 position: absolute;   
			}
			.progress .progress-bar {
				 background-color: #00AA00;
				 width: 0%;
				 height: 20px;
			}
			.log {
				width: 100%;
				color: white;
			}
			.level1 {
				background-color: #FF0000;
				font-weight: bold;
			}
			.level2 {
				background-color: #FF8800;
			}
			.level3 {
				background-color: #555555;
			}
			.level4 {
				background-color: #00AA00;
			}
			.level5 {
				background-color: #333333;
				font-size: 75%;
			}
			#scheduleEditWindow {
				display: none;
				/*border: 3px solid #888;*/
				background: black;
				padding: 5px;
				
			}
			#devices .key {
				cursor: pointer;
			}
			#devices .key:hover {
				cursor: pointer;
				background: #0A0;
			}
			.reading:after {
				content: "...";
			}
			.devcap:hover {
				cursor: pointer;
				background: #0A0;				
			}
			.devcap:before {
				content: "\25be";
			}
			#frontvalues {
				font-size: 1.3em;
			}
		</style>

	</head>

	<body>
	
		<div data-role="page" id="schedulepage" data-theme="b">
			<div data-role="header">
				<div data-role="navbar">
					<ul>
						<li><a href="#schedulepage" class="ui-btn-active">schedule</a></li>
						<li><a href="#devicepage">devices</a></li>
						<li><a href="#logpage">log</a></li>
					</ul>
				</div>
			</div>
			<div data-role="main" class="ui-content">
				<div class="normal">
					<a id="startschedule"
						  onclick="schedulestart(true)"
							class="button"
							title="start schedule">&#9658;</a>
					<a id="stopschedule"
						class="button"
					  onclick="schedulestart(false)"
						title="stop schedule">&#9724;</a>
					<a href="/schedule/edit" class="button" title="edit schedule">edit...</a>
					<a href="/loggerplot" class="button" title="plot logger">&#x2600;</a>
					<a href="/map" class="button" title="map">&#x2316;</a>
					<a href="/wiki" class="button" title="show wiki">?</a>
				</div>
				<h2>past</h2>
				<a class="button" href="/plot" title="Show plot page of the results">plot...</a>
				<div id="past" class="normal">
				</div>
	
				<h2 id="presentheader">present</h2>
				<div id="present" class="normal">
				</div>
	
				<h2>future</h2>
				<a class="button" onclick="Settings.nfuture++;" title="Make list of sample plan longer">+</a>
				<a class="button" onclick="Settings.nfuture--;" title="Make list of sample plan shorter">-</a>
				<a class="button" href="/schedule/edit" title="Edit the schedule">edit...</a>
				<div id="future">
				
				</div>
			</div>
		</div>
		<div data-role="page" id="devicepage" data-theme="b">
			<div data-role="header">
				<div data-role="navbar">
					<ul>
						<li><a href="#schedulepage" >schedule</a></li>
						<li><a href="#devicepage" class="ui-btn-active">devices</a></li>
						<li><a href="#logpage">log</a></li>
					</ul>
				</div>
			</div>
			<div data-role="main" class="ui-content">
				<div class="normal">
					<select id="statusrefreshtime" title="Automatic status update after:" class="statusprop">
						<option value="">never</option>
						<option value="500">500ms</option>
						<option value="1000">1s</option>
						<option value="5000">5s</option>
						<option value="10000">10s</option>
						<option value="30000">30s</option>
						<option value="60000">1min</option>
						<option value="300000">5min</option>
					</select>
					<select id="statusmaxplotlength" title="Maximum number of plot values" class="statusprop">
						<option value="10">10</option>
						<option value="50">50</option>
						<option value="100">100</option>
						<option value="500">500</option>
						<option value="1000">1000</option>
						<option value="5000">5000</option>
					</select>
					<a class="button" 
						 href="javascript:reloadstatus();" 
						 title="reload devicestatus">
					 	&#x21bb;
				 	</a>	
				 	<a class="button"
				 		onclick="alert(window.sessionStorage.getItem('Settings'));"
				 		title="show settings">
				 		&amp;
			 		</a>
				</div>
				<h1 class="plotcaption">actual progress</h1>
				<div class="plotcontainer">
					<div id="actualplot" class="plot"></div>
				</div>
				<h1 class="status">status</h1>
				<div id="error"></div>
				<div id="frontvalues" class="normal"></div>
				<div id="devices" class="normal"></div>
			</div> 
		</div>
		<div data-role="page" id="logpage" data-theme="b">
			<div data-role="header">
				<div data-role="navbar">
					<ul>
						<li><a href="#schedulepage" >schedule</a></li>
						<li><a href="#devicepage" >devices</a></li>
						<li><a href="#logpage" class="ui-btn-active">log</a></li>
					</ul>
				</div>
			</div>
			<div data-role="main" class="ui-content">
				level:
				<select id="loglevel">
					<option value="5">all...</option>
					<option value="1">1</option>
					<option value="2">2</option>
					<option value="3">3</option>
					<option value="4">4</option>
				</select>
				count:
				<select id="logcount">
					<option value="10">10</option>
					<option value="25">25</option>
					<option value="50">50</option>
					<option value="100">100</option>
				</select>
				<ul id="logs" class="normal" ></ul>
			</div>
		</div>
	</body>
</html>
