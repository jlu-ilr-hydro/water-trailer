<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<!-- Always force latest IE rendering engine (even in intranet) & Chrome Frame
		Remove this if you use the .htaccess -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

		<title>trailer.plot</title>
		<meta name="description" content="">
		<meta name="author" content="kraft-p">

		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="/libs/jquery-ui.min.css" rel="stylesheet" type="text/css"/>
		<link href="/html/trailer.css" rel="stylesheet" type="text/css"/>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<script src="/libs/jquery.min.js" type="text/javascript"></script>
		<script src="/libs/jquery-ui.min.js" type="text/javascript"></script>
		<script src="/libs/moment.min.js" type="text/javascript"></script>
		<script src="/libs/flot/jquery.flot.js" type="text/javascript" ></script>
		<script src="/libs/flot/jquery.flot.selection.js" type="text/javascript" ></script>
		<script src="/libs/flot/jquery.flot.time.js" type="text/javascript" ></script>
		<script src="/html/plot.js" type="text/javascript" ></script>
		<script>

			function fmtTime(t) {
				return moment(t).format('DD.MM.YYYY HH:mm');
				
			}
			function loadData() {
				Settings.histplot.valuetype = $("#valuetype_head").attr("key");
				Settings.histplot.days = $('#days').val();
				window.sessionStorage.Settings = JSON.stringify(Settings,null,'    ');
				$("#time").text('loading...');
				$.getJSON('data', Settings.histplot, function(data) {
					makeplot($("#valuetype_head").html(),data)
					$("#time").text(moment().format('H:mm:ss'));
					if (Settings.reload)
						setTimeout(loadData, Settings.reload * 1000);
				});
			}
			function makeplot(label,data){
				$('.plotcaption').html(label);
				var axoptions = {
					color : '#BBB',
					tickColor : '#BBB',
					font : {
						color : 'white',
						size : 16
					},
				};
				var xaxoptions = $.extend({mode:'time',timezone:'browser'},axoptions);
				var options = {
				    legend : {
				        container: $('#legend'),
						noColumns: 0
					},
					canvas : false,
					series : {
						lines : {
							show : true
						},
						points : {
							show : true,
							fill : true
						}
					},
					xaxis : xaxoptions,
					yaxis : axoptions,
					grid : {
						color : '#BBB',
						backgroundColor : null,
						borderWidth : 2,
						borderColor : '#BBB',
					},
					selection: {
						mode: 'x'
					},
				};
				//
				var adata = $.map(data,function(value,index){
					return [value];
				});
				plot = $.plot("#plot", adata, options);
				$('#plot').bind('plotselected',function(event,ranges){
					$(".plotsettings").text(fmtTime(ranges.xaxis.from) + " to " + fmtTime(ranges.xaxis.to));
					$.each(plot.getXAxes(), function(_, axis) {
						var opts = axis.options;
						opts.min = ranges.xaxis.from;
						opts.max = ranges.xaxis.to;
					});
					plot.setupGrid();
					plot.draw();
					plot.clearSelection();
				});
			}


            function loadValueTypes() {
                // loads the value types for the select box
                $.getJSON('valuetypes', function (data) {
                    var all_values = buildJsonObject(data);


                    $.getJSON('amilogger', function (data) {
                        // Here we decide which view should be generated
                        if (data === true) {

                            for (var j in all_values) {

                                $('#valuetype').append(printSubMenu(all_values[j], 0,all_values[j].name));
                            }

                            function printSubMenu(obj, level, parent) {
                                var forPrint = "";
                                if (typeof obj === "object") {

                                    if (typeof parent === "undefined") {
                                        parent = "";
                                    }

                                    if (obj.hasOwnProperty("child"))
                                    {

                                        if(level > 0)
										{
										forPrint+="<div class='valuetypesSubBox	 valueSubItemExp_" + parent + "'>";
										}
										else{
                                            forPrint+="<div class='valueMainItem_" + parent + "'>";
										}

                                        forPrint+="<span style='margin-left:" + (20 * level) + "px ;' class='valuetypesMenu' key='"+ parent+ obj.name + "'><span key='' class='valuetypes_menu_expand'>+ </span>" + obj.name + "</span>";
                                        var l = level + 1;
                                        for (var i in obj.child) {

                                            forPrint+=printSubMenu(obj.child[i], l, parent+obj.name);
                                        }

										forPrint+="</div>";

                                    }
                                    else
									{
                                        forPrint+="<div class='valuetypesSubBox valueSubItemExp_" + parent + "'>";
                                        forPrint+="<span style='margin-left:" + (25 * level) + "px;' class='valuetypesSubItem valueSubItemExp_" + parent + "' key='" + obj.v[obj.name].name + "'><span>&#9679;</span>" + obj.name + " " + obj.v[obj.name].unit + "</span>";
                                        forPrint+="</div>";
                                    }
                                return forPrint;
                                }
                            }
                        }
                        else {
                            $.each(all_values, function (key, obj) {

                                $('#valuetype').append("<span class='valuetypesSubItem valuetypesSubItemBlock' key='" + obj.name + "'><span>&#9679;</span> " + obj.name + "</span>");

                            });
                        }
                    });




				    // setting up a handler that a selection is standardized set (to #valuetype_head)
					// and the information for later use will be read from #valuetype_head

					// find out if there is a information stored in the session
					if(Settings.histplot.valuetype !== "")
					{
						var tmp_render_key=Settings.histplot.valuetype;
					}
					else{
					    var tmp_render_key=Object.keys(all_values)[0];
					}
					// Mark the selected box green
					$("#valuetypesSubBox_"+tmp_render_key).css("display","block");
					$("#valuetypes_sub_item_"+tmp_render_key).addClass("valTyp_sel_val");
					// Set a "-" to make user to close the item
					$($($("#valuetypesSubBox_"+tmp_render_key).parent().children()[0]).children()[0]).html("-")
					// Set the selected value box with key and name information
					$("#valuetype_head").html($("#valuetypes_sub_item_"+tmp_render_key).html());
					$("#valuetype_head").attr("key",tmp_render_key);




					$('#valuetype').on('click', '.valuetypesSubItem', function(){
					   $(".valuetypesSubItem").each(function () {
					    $(this).removeClass("valTyp_sel_val");
						});
					   $(this).addClass("valTyp_sel_val");
					   $("#valuetype_head").html($(this).html());
					   $("#valuetype_head").attr("key",$(this).attr("key"));
					   loadData();
					});

					$('#days').val(Settings.histplot.days);

					loadData();

					$("#valuetype_head").click(function(){

					    var dis = $("#valuetype").css("display");
					    if(dis == "block")
						{
						    $("#valuetype").css("display","none");
						    //$("#plotParentDiv").css("top","5em");
						}
						else{
					        $("#valuetype").css("display","block");
					        //$("#plotParentDiv").css("top","30em");
						}

					});


					$('#valuetype').on('click', '.valuetypes_menu_expand', function(){
					  var key = $(this).parent().attr("key");
					  var dis = $(".valueSubItemExp_"+key).css("display");
						console.log(dis);
					  console.log(".valueSubItemExp_"+key);

					  if(dis === "block")
					  {
					      $(".valueSubItemExp_"+key).css("display","none");
					      $(this).html("+");
					  }
					  else{
					      $(".valueSubItemExp_"+key).css("display","block");
					      $(this).html("-");
					  }
                    });



				});				
			}
			$(function(){
				moment.locale('de-DE');
				if (window.sessionStorage.getItem('Settings')) {
					Settings = JSON.parse(window.sessionStorage.getItem('Settings'));
				} else {
				    Settings = {};
				}

				Settings.histplot = Settings.histplot || {
							valuetype: "mean_H2O",//$('#valuetype').val(),
							end: null,
							days: 7,
							}
				Settings.reload = Settings.reload || 0;
				loadValueTypes();
				$('#reload').click(loadData);
				$('#reload_time').change(function(e) {
					Settings.reload = $(this).val();
					loadData();
				});
				$('#reload_time').val(Settings.reload);
			});
		</script>
	</head>
	<body>
		<div class="fright big">
			<div class="SettingsPanels"> duration:
			<select id="days">
				<option value="0.041666666666">1h</option>
				<option value="0.125">3h</option>
				<option value="0.5">12h</option>
				<option value="1">1d</option>
				<option value="2">2d</option>
				<option value="7">7d</option>
				<option value="14">14d</option>
				<option value="30">30d</option>
				<option value="90">90d</option>
				<option value="180">180d</option>
				<option value="365">1a</option>
			</select>
			reload:
			<select id="reload_time">
				<option value="0">never</option>
				<option value="10">10s</option>
				<option value="60">1min</option>
				<option value="120">2min</option>
				<option value="300">5min</option>
				<option value="900">15min</option>
			</select>
			<a class="button" 
				 id="reload" 
				 title="reload">
				&#x21bb;
			</a>
			<a href="/loggerplot" class="button" title="plot logger">&#x2600;</a>
			<a href="/map" class="button" title="map">&#x2316;</a>
			<a href="/wiki" class="button" title="show wiki">?</a>
			<a class="button" href="/" title="home">&#x2302;</a>

			</div>
		</div>
		<h1>
			<a href="/" title="back to status" class="button">&lt;</a>
			<span class="plotcaption">plot</span>		
			<span class="small" id="time"></span>
		</h1>
		<!--<div id="values_items_menu"></div>-->
		<div  class="normal plot-legend" id="legend"></div>
		<div class="normal" id="plotParentDiv" >

			<div style="height: 30px; position: relative;">

			value type:
				<a id="valuetype_head" class="button">
					[click]
				</a>
			</div>
			<span id="valuetype"> </span>
			<div class="normal plot" id="plot">

			</div>
		</div>
	</body>
</html>
