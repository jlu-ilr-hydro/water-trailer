<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<!-- Always force latest IE rendering engine (even in intranet) & Chrome Frame
		Remove this if you use the .htaccess -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

		<title>trailer.status</title>
		<meta name="description" content="">
		<meta name="author" content="kraft-p">

		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="/libs/jquery-ui/dist/themes/ui-lightness/jquery-ui.min.css" rel="stylesheet" type="text/css"/>
		<link href="/html/trailer.css" rel="stylesheet" type="text/css"/>
		<link href="/html/status.css" rel="stylesheet" type="text/css"/>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<script src="/libs/jquery/dist/jquery.js" type="text/javascript"></script>
		<script src="/libs/jquery-ui/dist/jquery-ui.min.js" type="text/javascript"></script>
		<script src="/libs/moment/moment.js" type="text/javascript"></script>
		<script src="/libs/flot/dist/es5/jquery.flot.js" type="text/javascript" ></script>
		<script src="/libs/flot/source/jquery.flot.time.js" type="text/javascript" ></script>		
		<script src="/html/status.js" type="text/javascript"></script>

	</head>

	<body>
		<div id="clock"></div>
	
		<div class="all">

		<div id="header">
			<div class="fright big" style="margin-top: 3px;">

					<a class="button"
						 href="javascript:reloadstatus();"
						 title="reload devicestatus">
					 	&#x21bb;
				 	</a>
				 	<a class="button"
				 		onclick="alert(window.sessionStorage.getItem('Settings'));"
				 		title="show settings">
				 		&amp;
			 		</a>

					<a href="/loggerplot" class="button" title="plot logger">&#x2600;</a>
					<a href="/map" class="button" title="map">&#x2316;</a>
					<a href="/wiki" class="button" title="show wiki">?</a>
					<a href="/yamleditor" class="button" title="yamleditor">&#9998;</a>
					<a class="button error" id="shutdown_server" title="shutdown the server">&times;</a>


				</div>
				<div class="fright">
					<select id="statusrefreshtime" title="Automatic status update after:" class="statusprop">
						<option selected value="">never</option>
						<option value="500">500ms</option>
						<option value="1000">1s</option>
						<option value="5000">5s</option>
						<option value="10000">10s</option>
						<option value="30000">30s</option>
						<option value="60000">1min</option>
						<option value="300000">5min</option>
					</select>
					<select id="statusmaxplotlength" title="Maximum number of plot values" class="statusprop">
						<option value="10">10</option>
						<option value="50">50</option>
						<option value="100">100</option>
						<option value="500">500</option>
						<option value="1000">1000</option>
						<option value="5000">5000</option>
					</select>
				</div>
			</div>


			<div class="leftpane">
				<h1 class="schedule">schedule</h1>		
				<div class="normal">
					<a id="startschedule"
						  onclick="schedulestart(true)" 
							class="button" 
							title="start schedule">&#9658;</a>
					<a id="stopschedule" 
						class="button" 
					  onclick="schedulestart(false)" 
						title="stop schedule">&#9724;</a>
					<a href="/schedule/edit" class="button" title="edit schedule">edit...</a>
					<span id="scheduleinfo"></span>
				</div>
				<h2>past</h2>
				<a class="button" onclick="Settings.npast++;" title="Make the history list longer">+</a>
				<a class="button" onclick="Settings.npast--;" title="Make the history list shorter">-</a>
				<a class="button" href="/plot" title="Show plot page of the results">plot...</a>
				<a class="button" href="/rack" title="Show rack plan">rack...</a>
				<div id="past" class="normal">
				</div>

				<h2 id="presentheader">present</h2>
				<div id="present" class="normal">
				</div>

				<h2>future</h2>
				<a class="button" onclick="Settings.nfuture++;" title="Make list of sample plan longer">+</a>
				<a class="button" onclick="Settings.nfuture--;" title="Make list of sample plan shorter">-</a>
				<a class="button" href="/schedule/edit" title="Edit the schedule">edit...</a>
				<a class="button" id="schedule_skip_next" title="Skip next source">skip</a>
				<span class="small normal" id="schedule_pos">act pos: ?</span>
				<div id="future">
				
				</div>
			</div>
			<div class="leftpane biggerpane">


				<h1 class="plotcaption">actual progress</h1>
				<div class="plotcontainer">
					<div id="actualplot" class="plot"></div>
				</div>
				<h1 class="status">device status</h1>
				<div id="error"></div>
				<div id="frontvalues" class="normal"></div>
				<div id="devices" class="normal">
				</div>
			</div><!-- centerpane -->
			<div class="leftpane">


				<h1>logs</h1>
				<div class="normal" style="max-height: 90%;">
					level:
					<select id="loglevel">
						<option value="5">all...</option>
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
					</select>
					count:
					<select id="logcount">
						<option value="10">10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="100">100</option>
					</select>
					<ul id="logs" class="normal" ></ul>
				</div>
			</div>
		</div>
	</body>
</html>
