[Mode]
inject_mode=auto

[Files]
output = "C:\temp"


[Output]


[Setup]
initial=StateStart
final=StateDone
error=StateError

[StateStart]
action="""
import CoordinatorScripts
INSTMGR = CoordinatorScripts.INSTMGR
logFunc("Starting")
logFunc("Instr Status = %s\n" % INSTMGR.INSTMGR_GetStatusRpc())
NEXT = "StateDone"
"""

[StateDone]
action="""
logFunc("Shutting down!")
sleep(3.0)
logFunc("Done!")
"""

[StateError]
action="""
logFunc("Error %s in state %s\n" % (ERROR_MSG,ERROR_STATE))
NEXT = "StateDone"
"""
